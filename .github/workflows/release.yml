name: Verify uploaded Alpha candidate (no publication)
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact accepted commit SHA
        required: true
      candidate_run_id:
        description: Successful workflow run containing a release-candidate artifact and actual native evidence
        required: true
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Verify successful candidate run belongs to this commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED: ${{ inputs.source_commit }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          gh run view "$RUN_ID" --json headSha,conclusion > run.json
          node -e 'const r=JSON.parse(require("fs").readFileSync("run.json"));if(r.headSha!==process.env.EXPECTED||r.conclusion!=="success")process.exit(1)'
          gh run list --workflow ci.yml --commit "$EXPECTED" --limit 1 --json headSha,conclusion > ci.json
          node -e 'const r=JSON.parse(require("fs").readFileSync("ci.json"));if(r[0]?.headSha!==process.env.EXPECTED||r[0]?.conclusion!=="success")process.exit(1)'
          gh run download "$RUN_ID" --name release-candidate --dir release-candidate
      - name: Locate APK verification tools
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -x "$sdk_root/build-tools/36.0.0/aapt2"
          test -r "$sdk_root/build-tools/36.0.0/lib/apksigner.jar"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
      - name: Fail closed on missing native acceptance, signatures or asset checks
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: node scripts/release-gate.mjs release-candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-candidate
          path: release-candidate/
