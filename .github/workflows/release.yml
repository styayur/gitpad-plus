name: Verified Alpha pre-release
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact accepted commit SHA
        required: true
      candidate_run_id:
        description: Successful workflow run containing a release-candidate artifact and actual native evidence
        required: true
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Verify successful candidate run belongs to this commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED: ${{ inputs.source_commit }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          gh run view "$RUN_ID" --json headSha,conclusion > run.json
          node -e 'const r=JSON.parse(require("fs").readFileSync("run.json"));if(r.headSha!==process.env.EXPECTED||r.conclusion!=="success")process.exit(1)'
          gh run list --workflow ci.yml --commit "$EXPECTED" --limit 1 --json headSha,conclusion > ci.json
          node -e 'const r=JSON.parse(require("fs").readFileSync("ci.json"));if(r[0]?.headSha!==process.env.EXPECTED||r[0]?.conclusion!=="success")process.exit(1)'
          gh run download "$RUN_ID" --name release-candidate --dir release-candidate
      - name: Fail closed on missing native acceptance, signatures or asset checks
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: node scripts/release-gate.mjs release-candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-candidate
          path: release-candidate/
  publish:
    needs: verify
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-candidate
          path: release-candidate
      - name: Publish new immutable tag and pre-release, then re-download assets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          node scripts/release-gate.mjs release-candidate
          if git ls-remote --exit-code --tags origin refs/tags/v0.1.0-alpha.1; then echo 'Tag already exists; refusing replacement'; exit 1; fi
          if gh release view v0.1.0-alpha.1 >/dev/null 2>&1; then echo 'Release already exists'; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v0.1.0-alpha.1 "$SOURCE_COMMIT" -m 'GitPad+ v0.1.0-alpha.1 verified early alpha'
          git push origin refs/tags/v0.1.0-alpha.1
          gh release create v0.1.0-alpha.1 --verify-tag --prerelease --title 'GitPad+ v0.1.0-alpha.1 — Early Alpha' --notes-file release-candidate/RELEASE_NOTES.md release-candidate/*.zip release-candidate/*.apk release-candidate/SHA256SUMS.txt release-candidate/SBOM.spdx.json
          gh release download v0.1.0-alpha.1 --dir downloaded
          cd downloaded
          sha256sum --check SHA256SUMS.txt
